<!-- Абзацы без заголовка — подводка к следующей картинке или пояснение
     к предыдущей.
     Тексты: paragraphs[].line

     Заголовка у блока нет намеренно: такой текст не должен появляться
     в оглавлении кейса. Нужен заголовок — это case/prose.html. -->
<div class="M_ArticleBlock">
  {{#each text.paragraphs}}
  <p>{{ line }}</p>
  {{/each}}
</div>
