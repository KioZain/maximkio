<!-- Обложка кейса. Путь приходит без расширения: из одного cover движок
     собирает все четыре адреса ниже. См. case/picture.html. -->
<picture>
  <source
    type="image/avif"
    srcset="
      ../../images/derived/{{ text.cover }}@1x.avif 1x,
      ../../images/derived/{{ text.cover }}@2x.avif 2x
    "
  />
  <img
    src="../../images/derived/{{ text.cover }}@2x.webp"
    srcset="
      ../../images/derived/{{ text.cover }}@1x.webp 1x,
      ../../images/derived/{{ text.cover }}@2x.webp 2x
    "
    alt="{{ text.coverAlt }}"
    class="A_CoverProject"
    fetchpriority="high"
  />
</picture>

<div class="S_ProjectAbout">
  <div class="M_HeadTagsAbout">
    <div class="C_Tags">
      {{#each text.tags}}
      <div class="A_Tag" data-kind="{{ kind }}">{{ label }}</div>
      {{/each}}
    </div>
    <h3 id="{{ id }}">{{ text.title }}</h3>
    <p>{{ text.lead }}</p>

    <!-- Оглавление кейса на узком экране: на широком оно стоит на полях
         само по себе, здесь — открывает шторку с тем же списком.
         См. A_ButtonContents.css и contentsSheet.js. -->
    <button
      type="button"
      class="A_Button E_Click A_ButtonContents"
      data-contents
      data-contents-close="{{ case.contentsClose }}"
    >
      <svg
        class="Q_Icon"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path
          d="M9.12109 5H21.1211M9.12109 12H21.1211M9.12109 19H21.1211"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M3.24609 5H3.12109M3.37109 5C3.37109 5.13807 3.25916 5.25 3.12109 5.25C2.98302 5.25 2.87109 5.13807 2.87109 5C2.87109 4.86193 2.98302 4.75 3.12109 4.75C3.25916 4.75 3.37109 4.86193 3.37109 5Z"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M3.24609 12H3.12109M3.37109 12C3.37109 12.1381 3.25916 12.25 3.12109 12.25C2.98302 12.25 2.87109 12.1381 2.87109 12C2.87109 11.8619 2.98302 11.75 3.12109 11.75C3.25916 11.75 3.37109 11.8619 3.37109 12Z"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M3.24609 19H3.12109M3.37109 19C3.37109 19.1381 3.25916 19.25 3.12109 19.25C2.98302 19.25 2.87109 19.1381 2.87109 19C2.87109 18.8619 2.98302 18.75 3.12109 18.75C3.25916 18.75 3.37109 18.8619 3.37109 19Z"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

      {{ case.contents }}
    </button>
  </div>

  <table class="O_Table">
    <tbody>
      {{#each text.facts}}
      <tr>
        <td>{{ label }}</td>
        <td>{{ value }}</td>
      </tr>
      {{/each}}
    </tbody>
  </table>
</div>
