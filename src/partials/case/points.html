<!-- Нумерованные карточки: по карточке на пункт, номер в кружке слева.
     Тексты: items[].line

     Заголовка у блока нет: карточки идут продолжением абзаца выше и в
     оглавление кейса не попадают. Заголовок нужен — это case/prose.html
     перед этим блоком, как сделано в кейсе про веб-плакат.

     Номера рисует CSS счётчиком, а не разметка и не словарь: пункт можно
     добавить, убрать или переставить, ничего не перенумеровывая. См.
     C_CasePoints.css. -->
<ol class="C_CasePoints">
  {{#each text.items}}
  <li class="M_CasePoint">{{ line }}</li>
  {{/each}}
</ol>
