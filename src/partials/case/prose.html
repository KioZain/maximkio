<!-- Заголовок и несколько абзацев.
     Тексты: title, paragraphs[].line

     Отличается от case/text.html только числом абзацев: там один body,
     здесь массив. Когда абзац один, массив из одного элемента — так
     структура блока не меняется от длины текста.

     title рисуется как <h3> и тем самым добавляет блок в оглавление
     кейса — меню собирается из блоков с заголовком. -->
<div class="M_ArticleBlock">
  <h3 id="{{ id }}">{{ text.title }}</h3>
  {{#each text.paragraphs}}
  <p>{{ line }}</p>
  {{/each}}
</div>
