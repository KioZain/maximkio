<!-- Анимированная картинка бегущей строки — бывшая гифка.

     Данные те же, что у picture: id и размер на экране в 1x.

     Отличий от picture два, и оба вынуждены форматом:

     avif тут нет — он не умеет анимацию, поэтому и <picture> не нужен,
     хватает одного <img> с webp.

     Вариант один на все плотности экрана. Полноценная ретина для анимации
     неподъёмна: кадров под сотню, и файл вырастает в семь раз. Запас в
     полтора раза скрипт кладёт внутрь самого файла, см. scripts/images.mjs. -->
<div class="A_MaqueItem">
  <img
    src="images/derived/marquee/{{ id }}@1x.webp"
    width="{{ width }}"
    height="{{ height }}"
    alt=""
    loading="lazy"
    decoding="async"
  />
</div>
