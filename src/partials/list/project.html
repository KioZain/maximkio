<!-- Карточка проекта на главной: обложка, теги, название и описание.

     Тексты и данные приходят из словаря: партиал ставится внутрь цикла по
     projects.items, поэтому cover / href / title / description берутся из
     текущего элемента массива — см. projects.items в src/locales/*.json.

     Писать в комментариях фигурные скобки движка нельзя: он не отличает
     их от разметки и честно попробует выполнить.

     Путь к обложке пишется от src/images/ и БЕЗ расширения — и префикс, и
     формат знает кусок разметки, и только он. Из одного cover собираются все
     четыре адреса; производные делает npm run images, см. scripts/images.mjs.

     В src картинки никогда не ставится site.root: адрес считает html-loader
     от файла шаблона, а не от готовой страницы (см. i18n/README).

     Ссылка на кейс — обычный относительный путь, тоже без site.root: дерево
     /en/ зеркалит корень, поэтому с английской главной она ведёт на
     английскую версию кейса, а не на русскую.

     Теги перебираются циклом по tags текущего проекта — так же, как в
     case/intro.html. Условий в движке нет, поэтому контейнер тегов рисуется
     всегда: у проекта без тегов массив просто пустой.

     Нажатием занимается эффект E_Click: класс на корне — больше от разметки
     ничего не требуется, см. E_Click.css и чанк «click». -->

<a href="{{ href }}" class="O_ProjectCard E_Click">
  <div class="Q_ProjectCover">
    <picture>
      <source
        type="image/avif"
        srcset="
          ./images/derived/{{ cover }}@1x.avif 1x,
          ./images/derived/{{ cover }}@2x.avif 2x
        "
      />
      <img
        src="./images/derived/{{ cover }}@2x.webp"
        srcset="
          ./images/derived/{{ cover }}@1x.webp 1x,
          ./images/derived/{{ cover }}@2x.webp 2x
        "
        alt="{{ coverAlt }}"
        loading="lazy"
        decoding="async"
      />
    </picture>
  </div>

  <div class="M_AboutProject">
    <div class="W_TitleTags">
      <div class="C_Tags">
        {{#each tags}}
        <div class="A_Tag" data-kind="{{ kind }}">{{ label }}</div>
        {{/each}}
      </div>
      <p id="date">{{ date }}</p>
    </div>
    <h3>{{ title }}</h3>
    <p>{{ description }}</p>
  </div>
</a>
